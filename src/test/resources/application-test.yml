spring:
  datasource:
    url: jdbc:h2:mem:quotaguard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: test-secret-test-secret-test-secret-test
    expiration: PT1M
    refresh-expiration: PT1H

quotaguard:
  default-daily-limit: 100
  penalty-decay-per-reset: 1
  reset-cron: "0 0 0 * * *"
  penalties:
    short-cooldown: PT15M
    long-cooldown: PT4H
  sessions:
    units-per-minute: 1
    minimum-charge: 1
  validation:
    quota:
      min: 1
      max: 100000
      reject-overflow: true
    pagination:
      min-page: 0
      max-page: 100000
      max-size: 100
      default-page: 0
      default-size: 20
    password:
      min-length: 8
      max-length: 100
      require-upper: true
      require-lower: true
      require-digit: true
      require-special: true
      special-chars: "!@#$%^&*()_+-=[]{};:'\",.<>/?\\|`~"

management:
  endpoint:
    health:
      show-details: always
      show-components: always
