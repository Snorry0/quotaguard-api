spring:
  application:
    name: quotaguard

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quotaguard}
    username: ${DB_USERNAME:quotaguard}
    password: ${DB_PASSWORD:quotaguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  sql:
    init:
      mode: never

quotaguard:
  api-version: ${QUOTAGUARD_API_VERSION:0.4.0-SNAPSHOT}
  default-daily-limit: ${DEFAULT_DAILY_LIMIT:100}
  penalty-decay-per-reset: ${PENALTY_DECAY_PER_RESET:1}
  reset-cron: "${QUOTA_RESET_CRON:0 0 0 * * *}"
  penalties:
    short-cooldown: "${SHORT_COOLDOWN:PT15M}"
    long-cooldown: "${LONG_COOLDOWN:PT4H}"
  sessions:
    units-per-minute: ${SESSION_UNITS_PER_MINUTE:1}
    minimum-charge: ${SESSION_MINIMUM_CHARGE:1}
  rate-limiting:
    endpoints:
      "[/api/v1/auth/login]":
        tokens: 5
        refill-period: 1m
      "[/api/v1/auth/register]":
        tokens: 20
        refill-period: 1h
      "[/api/v1/auth/refresh]":
        tokens: 10
        refill-period: 1m
  cache:
    caches:
      users:
        ttl: 5m
        max-size: 1000
      adminQueries:
        ttl: 30s
        max-size: 50
  validation:
    quota:
      min: 1
      max: 100000
      reject-overflow: true
    pagination:
      min-page: 0
      max-page: 100000
      max-size: 100
      default-page: 0
      default-size: 20
    password:
      min-length: 8
      max-length: 100
      require-upper: true
      require-lower: true
      require-digit: true
      require-special: true
      special-chars: "!@#$%^&*()_+-=[]{};:'\",.<>/?\\|`~"

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-before-production-dev-only-secret}
    expiration: "${JWT_EXPIRATION_MINUTES:15}m"
    refresh-expiration: "${JWT_REFRESH_EXPIRATION_DAYS:30}d"

springdoc:
  # Keep broken reference definitions in the served spec. springdoc's default
  # (true) strips schemas that fail an internal Jackson round-trip clone; the
  # Map-typed `validationErrors` field on ErrorResponse triggers that clone
  # failure, which strips BOTH ErrorResponse and FieldErrorDetail from the
  # served spec and leaves every reusable error response ($ref) dangling.
  # The clone failure is a springdoc framework quirk (not a spec defect);
  # the served spec is correct with this flag set to false.
  remove-broken-reference-definitions: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    display-operation-id: true
    doc-expansion: none
    persist-authorization: true
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
    resolve-schema-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false
  metrics:
    enable:
      jvm: true
      process: true
      system: true